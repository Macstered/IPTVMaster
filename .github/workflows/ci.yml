name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: docker build -t iptvmaster:ci .
      - name: Verify database backup and restore
        run: bash scripts/verify-backup-restore.sh
        env:
          IPTVMASTER_IMAGE: iptvmaster:ci
          VERIFY_SKIP_BUILD: 'true'
