name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Build versioned container
        run: |
          docker build \
            --build-arg IPTVMASTER_VERSION=ci \
            --build-arg "IPTVMASTER_REVISION=$GITHUB_SHA" \
            --tag iptvmaster:ci .
          test "$(docker image inspect iptvmaster:ci --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')" = ci
          test "$(docker image inspect iptvmaster:ci --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$GITHUB_SHA"
      - name: Verify refresh persistence and timings
        run: |
          docker run -d --name iptvmaster-refresh-test \
            -e POSTGRES_DB=iptvmaster_refresh_test \
            -e POSTGRES_USER=fixture -e POSTGRES_PASSWORD=synthetic-fixture-only \
            -p 127.0.0.1:15483:5432 postgres:17-alpine
          trap 'docker rm -f iptvmaster-refresh-test >/dev/null' EXIT
          node scripts/verify-refresh-performance.mjs
        env:
          REFRESH_TEST_DATABASE_URL: postgresql://fixture:synthetic-fixture-only@127.0.0.1:15483/iptvmaster_refresh_test
      - name: Verify database backup and restore
        run: bash scripts/verify-backup-restore.sh
        env:
          IPTVMASTER_IMAGE: iptvmaster:ci
          VERIFY_SKIP_BUILD: 'true'
