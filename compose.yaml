name: iptvmaster

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    # A stop has to finish its final checkpoint. On slow storage that takes
    # longer than the ten-second default, after which the process is killed
    # and the next start spends minutes replaying WAL before the app can
    # connect.
    stop_grace_period: 5m
    # Parallel query workers share memory; the 64 MB container default fails
    # large sorts with "could not resize shared memory segment".
    shm_size: 256m
    # Defaults sized for a small guest with 1-2 GB of memory. Override any
    # value in .env; the knobs are documented in .env.example.
    command:
      - postgres
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-256MB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-1GB}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-16MB}
      - -c
      - maintenance_work_mem=128MB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - max_wal_size=2GB
      - -c
      - wal_compression=on
      - -c
      - random_page_cost=${POSTGRES_RANDOM_PAGE_COST:-4}
      - -c
      - synchronous_commit=${POSTGRES_SYNCHRONOUS_COMMIT:-on}
      - -c
      - jit=off
      - -c
      - track_io_timing=on
      - -c
      - log_min_duration_statement=${POSTGRES_LOG_MIN_DURATION_MS:-1000}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-iptvmaster}
      POSTGRES_USER: ${POSTGRES_USER:-iptvmaster}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
      # Crash recovery after an unclean shutdown can take minutes on slow
      # storage; do not count those probes as failures.
      start_period: 10m
    security_opt:
      - no-new-privileges:true

  app:
    image: ${IPTVMASTER_IMAGE:-ghcr.io/macstered/iptvmaster:0.2.1}

    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8080
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PLAYLIST_REFRESH_ENABLED: ${PLAYLIST_REFRESH_ENABLED:-true}
      PLAYLIST_REFRESH_INTERVAL_MINUTES: ${PLAYLIST_REFRESH_INTERVAL_MINUTES:-120}
      PLAYLIST_REFRESH_INITIAL_DELAY_SECONDS: ${PLAYLIST_REFRESH_INITIAL_DELAY_SECONDS:-30}
      PLAYLIST_MAX_RETAINED_ENTRIES: ${PLAYLIST_MAX_RETAINED_ENTRIES:-500000}
      EPG_REFRESH_ENABLED: ${EPG_REFRESH_ENABLED:-true}
      EPG_REFRESH_INTERVAL_MINUTES: ${EPG_REFRESH_INTERVAL_MINUTES:-720}
      EPG_REFRESH_INITIAL_DELAY_SECONDS: ${EPG_REFRESH_INITIAL_DELAY_SECONDS:-60}
      PROVIDER_RETRY_ATTEMPTS: ${PROVIDER_RETRY_ATTEMPTS:-3}
      PROVIDER_RETRY_INITIAL_DELAY_SECONDS: ${PROVIDER_RETRY_INITIAL_DELAY_SECONDS:-2}
      PROVIDER_RETRY_MAX_DELAY_SECONDS: ${PROVIDER_RETRY_MAX_DELAY_SECONDS:-30}
      CHANNEL_RETENTION_REFRESHES: ${CHANNEL_RETENTION_REFRESHES:-5}
      SNAPSHOT_RETENTION_COUNT: ${SNAPSHOT_RETENTION_COUNT:-3}
      MAINTENANCE_ENABLED: ${MAINTENANCE_ENABLED:-true}
      MAINTENANCE_INTERVAL_MINUTES: ${MAINTENANCE_INTERVAL_MINUTES:-1440}
      MAINTENANCE_INITIAL_DELAY_SECONDS: ${MAINTENANCE_INITIAL_DELAY_SECONDS:-300}
      IPTVMASTER_SESSION_HOURS: ${IPTVMASTER_SESSION_HOURS:-168}
      IPTVMASTER_SECURE_COOKIES: ${IPTVMASTER_SECURE_COOKIES:-false}
      IPTVMASTER_ALLOWED_SOURCE_CIDRS: ${IPTVMASTER_ALLOWED_SOURCE_CIDRS:-}
      IPTVMASTER_ALLOW_PRIVATE_SOURCE_ADDRESSES: ${IPTVMASTER_ALLOW_PRIVATE_SOURCE_ADDRESSES:-false}
      DATABASE_URL: postgresql://${POSTGRES_USER:-iptvmaster}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-iptvmaster}
      IPTVMASTER_MASTER_KEY: ${IPTVMASTER_MASTER_KEY:?Set IPTVMASTER_MASTER_KEY in .env}
    ports:
      - '${IPTVMASTER_PORT:-8080}:8080'
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/ready']
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
